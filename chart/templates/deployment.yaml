apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api
  labels: {app: ticket-api}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: ticket-api}
  template:
    metadata:
      labels: {app: ticket-api}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: ticket-runtime
      automountServiceAccountToken: false
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true}
      containers:
        - name: api
          image: {{ .Values.image.ref | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef: {name: ticket-api-config, key: APP_VERSION}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.databaseSecret }}, key: DATABASE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readinessPath | quote }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 8
          resources:
{{ toYaml .Values.resources | indent 12 }}
