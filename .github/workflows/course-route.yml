name: Advanced course route acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible jq unzip
          chmod +x lab scripts/*.sh
          ./lab tools
          python -m venv .venv-ui
          .venv-ui/bin/pip install playwright==1.55.0
      - name: Real positive and negative route
        run: bash qa/route.sh > course-route.log 2>&1
      - name: Failure details
        if: failure()
        run: tail -n 100 course-route.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: advanced-course-route
          path: |
            course-route.log
            evidence/
            backups/**/manifest.json
            backups/**/restore*.json
          retention-days: 30
