name: Advanced isolated routing convergence experiment
on:
  push:
    branches: [codex/devops-quality-20261023]
    paths:
      - .github/workflows/routing-convergence-experiment.yml
      - ci/convergence.py
      - ci/routing_stress.py
      - ci/deploy.py
      - safety_tests/test_convergence.py
permissions:
  contents: read
jobs:
  route:
    if: github.ref == 'refs/heads/codex/devops-quality-20261023'
    env:
      DVA_ROUTING_DIAGNOSTIC: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible jq unzip
          chmod +x lab scripts/*.sh
          ./lab tools
          python -m venv .venv-ui
          .venv-ui/bin/pip install playwright==1.55.0
      - name: Real positive and negative route
        run: bash qa/route.sh > course-route.log 2>&1
      - name: Three bounded diagnostic config rollouts after route PASS
        run: python ci/routing_stress.py --root . --namespace dev > routing-stress.log 2>&1
      - name: Failure details
        if: failure()
        run: tail -n 100 course-route.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: advanced-course-route
          path: |
            course-route.log
            routing-stress.log
            evidence/
            backups/**/manifest.json
            backups/**/restore*.json
          retention-days: 30
