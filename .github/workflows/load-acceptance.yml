name: Advanced causal load acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq unzip
          chmod +x lab scripts/*.sh
          ./lab tools
      - name: Causal 3+3 load and full row comparison
        run: bash qa/load.sh > load-acceptance.log 2>&1
      - name: Failure details
        if: failure()
        run: tail -n 80 load-acceptance.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: advanced-causal-load
          path: |
            load-acceptance.log
            evidence/
          retention-days: 30
