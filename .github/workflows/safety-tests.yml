name: Offline safety unit checks
on:
  push:
    branches: [codex/devops-quality-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Stdlib tests with mock HTTP and command boundaries
        run: python -m unittest discover -s safety_tests -v
