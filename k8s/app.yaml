apiVersion: v1
kind: ServiceAccount
metadata: {name: ticket-runtime}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ticket-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ticket-api}
  template:
    metadata:
      labels: {app: ticket-api}
    spec:
      serviceAccountName: ticket-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: api
          image: dva-ticket:advanced-m04
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: dva-app-db, key: DATABASE_URL}
          ports: [{name: http, containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 8
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ticket-api}
spec:
  selector: {app: ticket-api}
  ports: [{name: http, port: 8000, targetPort: http}]
