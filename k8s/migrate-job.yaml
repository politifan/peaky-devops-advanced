apiVersion: batch/v1
kind: Job
metadata: {name: migrate-m04}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: dva-ticket:advanced-m04
          imagePullPolicy: IfNotPresent
          command: [python, '-m', alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: dva-migrate-db, key: DATABASE_URL}
