- name: Place a demonstration token with limited file permissions
  hosts: training
  become: true
  vars_files:
    - "{{ playbook_dir }}/../.runtime/vault.yml"
  tasks:
    - name: Create private configuration directory
      ansible.builtin.file:
        path: /etc/dva
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Write token without logging its value
      ansible.builtin.copy:
        dest: /etc/dva/token
        content: "{{ training_token }}\n"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      diff: false
