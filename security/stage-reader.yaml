apiVersion: v1
kind: ServiceAccount
metadata: {name: ticket-reader, namespace: stage}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ticket-reader, namespace: stage}
rules:
  - apiGroups: ['']
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ticket-reader, namespace: stage}
subjects:
  - {kind: ServiceAccount, name: ticket-reader, namespace: stage}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ticket-reader
