apiVersion: v1
kind: ServiceAccount
metadata: {name: course-reader, namespace: dev}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: course-reader, namespace: dev}
rules:
  - apiGroups: ['']
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: course-reader, namespace: dev}
subjects:
  - {kind: ServiceAccount, name: course-reader, namespace: dev}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: course-reader
